name: Playwright Tests

on:
  push:
    branches: [main]
  #pull_request:
  #  branches: [main]

jobs:
  playwright-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [ 1, 2, 3, 4 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (shard=${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Allure results (shard=${{ matrix.shard }}/4)
        uses: actions/upload-artifact@v4
        with: 
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results


  merge-allure-report:
    needs: playwright-test
    if: always()
    runs-on:  ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #- name: Run Smoke Tests shard=${{ matrix.shard }}/4
      #  run: npx playwright test tests/Smoke

      #- name: Run Regression Tests shard=${{ matrix.shard }}/4
      #  run: npx playwright test tests/Regression

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/